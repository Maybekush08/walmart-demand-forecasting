# Temporal Fusion Transformer
model:
  name: tft
  input_window: 28
  forecast_horizon: 28
  d_model: 128
  n_heads: 4
  tft_lstm_layers: 1
  d_ff: 256
  dropout: 0.1

data:
  data_dir: data/m5
  store_id: CA_1
  history_days: 365
  train_ratio: 0.8
  val_ratio: 0.1

training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.0001
  scheduler: cosine
  patience: 10
  num_workers: 0
  device: auto
